name: sync-f1 race-aware

# Manual-only. The hourly `schedule` trigger was disabled because it requires the
# repo secret `CRON_SECRET_KEY` (and var `SITE_URL`), which are not set — every
# scheduled run failed. The daily Vercel cron (vercel.json:
# /api/cron/sync-f1?scope=season at 07:00 UTC) covers the baseline sync, and the
# season page now reads live Jolpica per-request when the DB snapshot is stale.
#
# To re-enable the race-aware hourly sync: set repo secret CRON_SECRET_KEY and
# var SITE_URL, then restore the `schedule:` block below:
#   schedule:
#     - cron: '0 * * * *'  # every hour on the hour (UTC)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Race-calendar sync check
        env:
          CRON_SECRET_KEY: ${{ secrets.CRON_SECRET_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npx tsx scripts/sync-f1-scheduled.ts
