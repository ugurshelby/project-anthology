name: sync-f1 race-aware

# Hourly race-calendar-aware sync. Re-enabled 2026-09-28 — repo secret
# CRON_SECRET_KEY and var SITE_URL are set. `scripts/sync-f1-scheduled.ts`
# only calls the sync endpoint when a session's due window has passed
# (see lib/f1/syncSchedule.ts), so this is a due-check, not a blind hourly hit.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # every hour on the hour (UTC)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Race-calendar sync check
        env:
          CRON_SECRET_KEY: ${{ secrets.CRON_SECRET_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        # No `npm ci`: the due-check uses only fetch and repo files (tsconfig paths),
        # so only tsx is downloaded (pinned to the lockfile version). Idle hours stay cheap.
        run: npx --yes tsx@4.22.4 scripts/sync-f1-scheduled.ts
